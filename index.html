<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Little Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="terminal" aria-label="Little Terminal interface">
      <canvas id="matrix" aria-hidden="true"></canvas>
      <header class="terminal-header">
        <div class="terminal-badge">
          <span class="badge-title">LITTLE TERMINAL</span>
          <span class="badge-version">v0.3</span>
        </div>
        <div class="mood" id="mood-display">
          <span id="mood-face" role="img" aria-label="Booting">🤖</span>
          <span id="mood-label">Booting</span>
        </div>
      </header>
      <div id="screen" aria-live="polite" role="log"></div>
      <input
        id="command"
        type="text"
        autocomplete="off"
        spellcheck="false"
        aria-label="Command input"
        autofocus
      />
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
